<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACE — Direction</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bone);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif;padding:16px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-family:Georgia,serif;font-size:19px;letter-spacing:5px}
.sub{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.sub a{color:var(--brass);text-decoration:none;text-transform:none;letter-spacing:0;margin-left:10px}
.key{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 18px;font-size:11px;color:var(--muted);align-items:center}
.key span{display:flex;gap:5px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.d-chosen{background:var(--ink)}
.d-lean{background:none;border:2px solid var(--brass)}
.d-open{background:none;border:1.5px dashed var(--text-3)}
.d-no{background:var(--surface4);position:relative}
.d-no::after{content:'';position:absolute;left:1px;right:1px;top:4px;height:1.5px;background:var(--bad)}

.branch{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-bottom:12px;overflow:hidden}
.bh{display:flex;align-items:baseline;gap:10px;padding:10px 13px;background:var(--surface3);cursor:pointer}
.bh b{font-family:Georgia,serif;font-size:14px;flex-shrink:0}
.bh .q{font-size:11.5px;color:var(--muted);flex:1}
.bh .pick{font-size:11px;color:var(--brass);font-weight:600;text-align:right}
.opts{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px}
.opt{border:1.5px dashed var(--text-3);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;
 background:none;color:var(--text-2);font-family:inherit;transition:all .12s;position:relative}
.opt:hover{border-color:var(--brass)}
.opt.lean{border:2px solid var(--brass);border-style:solid;color:var(--ink)}
.opt.chosen{background:var(--ink);color:var(--bone);border:2px solid var(--ink)}
.opt.no{background:var(--line);color:var(--text-3);border-style:solid;border-color:var(--line);text-decoration:line-through}
.note{padding:0 13px 11px;font-size:11.5px;color:var(--muted);line-height:1.45}
.note b{color:var(--ink)}
.sum{background:var(--ink);color:var(--bone);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.sum h2{font-family:Georgia,serif;font-size:14px;margin-bottom:8px;color:var(--primary-t)}
.sum .row{font-size:12px;padding:3px 0;display:flex;gap:8px}
.sum .row i{color:var(--text-2);font-style:normal;min-width:120px;font-size:11px}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
.foot a{color:var(--brass)}
</style>
</head>
<body>
<div class="wrap">
<h1>TRACE</h1>
<div class="sub">Direction — nothing set in stone
   <a href="home.html" style="color:var(--brass);text-decoration:none;text-transform:none;letter-spacing:0;margin-left:10px">← Home</a></div>

<div class="key">
 <span><i class="dot d-chosen"></i>decided</span>
 <span><i class="dot d-lean"></i>leaning</span>
 <span><i class="dot d-open"></i>still open</span>
 <span><i class="dot d-no"></i>ruled out</span>
 <span style="margin-left:auto">click any option to cycle it</span>
</div>

<div class="sum" id="sum"></div>
<div id="tree"></div>
<div class="foot">Choices persist on this device. <a href="#" id="reset">Reset all</a></div>
</div>

<script>
const $=s=>document.querySelector(s);
const KEY='trace:direction';
const Store={
 async get(k){if(window.storage){try{const r=await window.storage.get(k,false);return r?r.value:null}catch(e){}}
  try{return localStorage.getItem(k)}catch(e){return null}},
 async set(k,v){if(window.storage){try{await window.storage.set(k,v,false);return}catch(e){}}
  try{localStorage.setItem(k,v)}catch(e){}}};
const CYCLE=['open','lean','chosen','no'];
let S={};

// branch, question, [options], default states, note
const TREE=[
 ['Positioning','who is this actually for?',
  [['Niche purist — enthusiasts only','no'],['Accessible premium','chosen'],
   ['Mass-market dupe tier','no'],['Luxury / high-price','open']],
  'You chose reach over purity earlier. That single decision cascades into naming, disclosure and packaging — most of the tensions below trace back to it.'],

 ['First release','how many scents at launch?',
  [['Single hero scent','lean'],['Trio','open'],['Discovery set of 3 × 10ml','lean'],
   ['Five or more','no']],
  'A trio needs three formulas at commercial quality; you have one candidate. A single hero plus a discovery set is the honest reflection of where the work actually is.'],

 ['The hero','which scent leads?',
  [['Slow Amber II — caramel/toffee','chosen'],['Orange-Peach-Tobacco','lean'],
   ['Climate — the humidity thesis','open'],['First Rain','open']],
  'Slow Amber II is the only formula built to commercial intent. Climate is the most defensible <b>story</b> — a fragrance designed for this climate rather than imported into it — but it is untested.'],

 ['Ingredient disclosure','what goes on the back?',
  [['Pyramid + translated full list','chosen'],['Poetic note pyramid alone','lean'],
   ['Allergen list only (legal minimum)','open'],['Raw material list, untranslated','no']],
  'REVISED after Bastille Parfums. They publish <b>both</b> a poetic pyramid and all 29 materials — and translate every synthetic into scent language: "Ambroxan (wood, ambergris)", "Cashmeran (musk, wood)", "Hedione (fresh jasmine)". The problem was never the listing, it was listing <b>untranslated</b>. They also frame the count as the argument: 29 ingredients versus up to 300 in a classic perfume. Your formulas run 12–19 — a stronger version of the same claim. Do not copy their "95% natural" line; yours are mostly synthetic. Your equivalent is <b>short, disclosed, built for this climate</b>.'],

 ['The story','what is the brand actually about?',
  [['Place — Karachi, monsoon, salt air','lean'],['Process — one person, logged batches','lean'],
   ['Climate — built for heat and humidity','open'],['Founder personal narrative','open'],
   ['Pure aesthetics, no story','no']],
  'Place and process are not competing — process is how you earn the right to tell the place story. Climate is the sharpest commercial angle and nobody local is claiming it.'],

 ['Naming','how are scents named?',
  [['Plain English — First Rain, Slow Amber','chosen'],
   ['Classical — Apollo, Hera','no'],['Urdu / local language','open'],['Numbered only','no']],
  'Plain English fits your voice and reads internationally. THE NOTE. proves classical works in this market, but it is theirs already.'],

 ['Palette','the brand looks how?',
  [['Off-black, high contrast','lean'],['Cool true white, hard type','lean'],
   ['Warm bone + brass','no'],['Saturated colour per scent','chosen']],
  'REVISED. Warm bone plus Georgia serif plus letterspaced caps plus antique brass reads as heritage apothecary. The cause is low contrast and warmth. Modern reads as HIGH contrast: Valentino is black against gold, Spicebomb is gunmetal, Byredo is stark white with hard black type. Off-white can work, but only if nothing else is soft. Drop Georgia and the brass.'],

 ['Packaging','the physical object',
  [['Resin sleeve, dyed per scent','chosen'],['Form-driven sleeve, no pattern','lean'],
   ['Jali / traditional motif','no'],['Bone printed box','no'],
   ['Gift sleeve option at checkout','lean']],
  'The sleeve is the silhouette — your equivalent of the Flowerbomb grenade, at a cost a glass mould could never justify. Jali dropped: it codes traditional-Pakistani, which is not the brand. Do not replace it with another motif — Flowerbomb is FACETED, not decorated. Form carries recognition; pattern reads as souvenir, and fine detail prints badly in cheap resin.'],

 ['Price','where does it sit?',
  [['Under Rs 1,500','no'],['Rs 1,800–2,500 launch','lean'],
   ['Rs 3,000–4,000 established','lean'],['Rs 5,000+','open']],
  'Launch low to build reviews, then raise. THE NOTE. spans Rs 1,680–5,800 — sit inside that band, do not undercut it. Bastille\'s architecture is worth copying: smallest bottle as the entry price, and a <b>discovery set priced below the smallest bottle</b> (€32 vs €39) so trial has no hesitation. Their gift box is only a €7 premium — a conversion tool, not a margin play.'],

 ['First channel','where do you sell?',
  [['Instagram + WhatsApp direct','chosen'],['Daraz from day one','no'],
   ['Daraz once reviews exist','lean'],['Physical stockist','open'],['Own website','open']],
  'Direct first is right — margin, and you control the story. Daraz once there is social proof to point at.'],

 ['Marketing register','how do you speak?',
  [['Process documentation, no face','lean'],['Founder on camera','open'],
   ['Trend-led reels','no'],['Paid ads from launch','no'],
   ['Paid, small, seasonal only','lean']],
  'You have a strong aversion to the performing register. Process documentation is the honest alternative and compounds — but it is slower, and you should expect that.'],

 ['Seal / mark','the maker\'s mark',
  [['Wordmark only — the sleeve IS the mark','chosen'],['Two fig leaves + sevenfold rosette','no'],
   ['Sevenfold rosette alone','no'],['Crescent + ح','no']],
  'REVISED. Valentino has no seal, it has studs. Flowerbomb has no seal, it has a grenade. In both cases the mark IS the object, and a logo on top would dilute it. You were carrying four competing marks for a job the sleeve already does. Wordmark plus sleeve is the whole system: cheaper, more modern, and structurally identical to the brands you are pointing at.'],
];

function render(){
 const t=$('#tree');t.innerHTML='';
 TREE.forEach(([name,q,opts,note],bi)=>{
  const b=document.createElement('div');b.className='branch';
  const picked=opts.filter((o,i)=>(S[bi+'_'+i]||o[1])==='chosen').map(o=>o[0]);
  const lean=opts.filter((o,i)=>(S[bi+'_'+i]||o[1])==='lean').map(o=>o[0]);
  const h=document.createElement('div');h.className='bh';
  h.innerHTML='<b>'+name+'</b><span class="q">'+q+'</span><span class="pick">'+
   (picked.length?picked.join(' · '):lean.length?lean.join(' · ')+' (leaning)':'undecided')+'</span>';
  b.append(h);
  const o=document.createElement('div');o.className='opts';
  opts.forEach(([label,def],i)=>{
   const k=bi+'_'+i, st=S[k]||def;
   const btn=document.createElement('button');btn.className='opt'+(st==='open'?'':' '+st);
   btn.textContent=label;
   btn.onclick=()=>{const cur=S[k]||def;S[k]=CYCLE[(CYCLE.indexOf(cur)+1)%4];save();render()};
   o.append(btn);
  });
  b.append(o);
  const n=document.createElement('div');n.className='note';n.innerHTML=note;b.append(n);
  t.append(b);
 });
 summary();
}
function summary(){
 const s=$('#sum');
 let decided=0,open=0,rows='';
 TREE.forEach(([name,,opts],bi)=>{
  const ch=opts.filter((o,i)=>(S[bi+'_'+i]||o[1])==='chosen').map(o=>o[0]);
  if(ch.length){decided++;rows+='<div class="row"><i>'+name+'</i>'+ch.join(' · ')+'</div>'}
  else open++;
 });
 s.innerHTML='<h2>Settled so far — '+decided+' of '+TREE.length+'</h2>'+rows+
  (open?'<div class="row" style="margin-top:6px;color:var(--text-2)"><i>still open</i>'+open+' branches</div>':'');
}
function save(){Store.set(KEY,JSON.stringify(S))}
(async()=>{
 const v=await Store.get(KEY); if(v){try{S=JSON.parse(v)}catch(e){}}
 $('#reset').onclick=e=>{e.preventDefault();if(confirm('Reset every choice?')){S={};save();render()}};
 render();
})();
</script>
</body>
</html>
