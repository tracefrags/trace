<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bone:#F2EDE4;--paper:#FBF9F5;--ink:#1B2621;--brass:#A67C3D;--muted:#8A8378;
--line:#DED7CB;--warn:#9C7A28;--bad:#9C4A3F;--good:#4A6B52}
body{background:var(--bone);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif;padding:14px}
.wrap{max-width:1340px;margin:0 auto}
h1{font-family:Georgia,serif;font-size:19px;letter-spacing:5px;font-weight:700}
.sub{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.bar{display:flex;gap:9px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);
 border-radius:6px;padding:9px;margin-bottom:12px;align-items:flex-end}
.f{flex:1;min-width:96px}
.f label{display:block;font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
input,select{width:100%;border:1px solid var(--line);border-radius:4px;padding:5px 7px;font:inherit;font-size:13px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 400px;gap:12px;align-items:start}
@media(max-width:1060px){.grid{grid-template-columns:1fr}}
.mapbox{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px;overflow-x:auto}
svg{display:block}
.node{cursor:pointer}
.node circle{transition:r .12s}
.node:hover circle{stroke:#A67C3D;stroke-width:2}
.node text{font:10px system-ui,sans-serif;fill:#3A2C32;pointer-events:none}
.node.on text{font-weight:700;fill:#1B2621}
.node.sup text{fill:#B8B0A4}
.node.sug text{fill:#8A6A2F;font-weight:600}
.legend{font-size:9.5px;color:var(--muted);padding:4px 8px 0;display:flex;gap:14px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border:1.3px dashed #A67C3D;border-radius:50%;vertical-align:-2px;margin-right:4px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:11px;position:sticky;top:12px;max-height:95vh;overflow-y:auto}
.panel h3{font-family:Georgia,serif;font-size:14px}
.pm{font-size:11px;color:var(--muted);margin-bottom:8px}
.split{height:7px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:3px;background:var(--line)}
.split i{height:100%}
.sl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-bottom:9px}
.blk{border:1px solid var(--line);border-radius:5px;margin:6px 0;background:#fff}
.blkh{display:flex;align-items:center;gap:6px;padding:4px 7px;background:#F0E9DD;font-size:10.5px;border-radius:4px 4px 0 0}
.blkh b{flex:1;font-size:10px;color:var(--brass);letter-spacing:.6px;text-transform:uppercase}
.blkh .bp{font-variant-numeric:tabular-nums;font-weight:700;font-size:11px}
.blkh button{background:none;border:none;color:var(--bad);cursor:pointer;font-size:13px;padding:0 2px}
.row{display:flex;align-items:center;gap:5px;padding:3px 6px;font-size:12px;border-bottom:1px solid #EFE9DE}
.row:last-child{border-bottom:none}
.row .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.row .n{flex:1;line-height:1.2;font-size:11.5px;cursor:help}
.row input{width:50px;text-align:right;padding:2px 4px;font-size:11.5px}
.row select.bs{width:32px;padding:2px 1px;font-size:10px;border-color:#EFE9DE;cursor:pointer}
.row .g{width:74px;text-align:right;font-size:10px;color:var(--muted);line-height:1.25}
.row .c{width:36px;text-align:right;font-size:10px;color:var(--brass);font-variant-numeric:tabular-nums}
.row .x{background:none;border:none;color:var(--bad);cursor:pointer;font-size:13px;padding:0 1px}
.sub2{display:block;font-size:8.5px;color:var(--brass);line-height:1.3}
.row.tot{border-top:1.5px solid var(--ink);border-bottom:none;margin-top:4px;padding-top:5px;font-weight:600}
.row.tot .sp{width:50px;text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums}
.row.tot .g,.row.tot .c{color:var(--ink);font-size:10.5px}
.msg{border-radius:4px;padding:6px 8px;font-size:11px;margin-bottom:5px;line-height:1.35}
.msg.w{background:#F7EFDC;color:#6B5316}.msg.b{background:#F6E4E1;color:#7A3830}
.msg.g{background:#E6EFE7;color:#33513A}.msg.n{background:#EDE6DA;color:#5F5A52}
.emp{color:var(--muted);font-size:11.5px;font-style:italic;padding:9px 0}
h4{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--brass);margin:10px 0 4px}
.acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-width:76px;background:var(--ink);color:var(--bone);border:none;border-radius:4px;padding:6px;font:inherit;font-size:11.5px;cursor:pointer}
.btn.gh{background:none;color:var(--muted);border:1px solid var(--line)}
.bs2{padding:5px 0;border-bottom:1px solid #EFE9DE;font-size:11px;line-height:1.45}
.bs2:last-child{border-bottom:none}
.bs2 b{color:var(--brass);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase}
.bs2 .tm{display:inline-block;width:52px;color:#B0A69A;font-size:10px}
.bs2.good{color:var(--good)}.bs2.warn{color:var(--warn)}.bs2.bad{color:var(--bad)}
.bs2.good b,.bs2.warn b,.bs2.bad b{color:inherit}
#pv{display:none}
@media print{
 body{padding:0;background:#fff}
 .wrap{display:none}
 #pv{display:block;font:10px/1.4 system-ui,sans-serif;color:#000;padding:12mm}
 #pv h2{font-family:Georgia,serif;font-size:16px;letter-spacing:3px;margin-bottom:2px}
 #pv .meta{font-size:8.5px;color:#555;margin-bottom:8px;border-bottom:1.5px solid #A67C3D;padding-bottom:5px}
 #pv table{width:100%;border-collapse:collapse;margin-bottom:8px}
 #pv th{text-align:left;font-size:7.5px;text-transform:uppercase;letter-spacing:.6px;color:#666;border-bottom:1px solid #999;padding:3px}
 #pv td{padding:2.5px 3px;border-bottom:1px solid #E8E8E8;font-size:9px}
 #pv td.r{text-align:right;font-variant-numeric:tabular-nums}
 #pv tr.bh td{background:#F0E9DD;font-weight:700;font-size:8px;text-transform:uppercase;letter-spacing:.5px}
 #pv tr.tt td{border-top:1.5px solid #000;border-bottom:none;font-weight:700}
 #pv .cols{display:flex;gap:8mm}

 #pv .fl{font-size:8px;padding:2.5px 4px;background:#F5F0E6;border-left:2px solid #A67C3D;margin-bottom:2px}
}

// matched on the WHOLE normalised name, never as a substring — 'isoe' must not
// swallow 'isoeugenol'.
const ALIAS=[

 ['aldc18milk','aldc18coconut','aldc18','aldehydec18coconut','aldehydec18','gammanonalactone','nonalactone'],
 ['ethbrassylate','ethylenebrassylate'],

 ['isoesuper','isoe'],
 ['oakmoss','oakmossalt','oakmossalternative'],
 ['dhm','dhmdihydromyrcenol','dihydromyrcenol'],
 ['pea','peaphenylethylalcohol','phenylethylalcohol'],
 ['calone','calone1951'],
 ['tonkabean','tonkabeanoil'],
 ['cinnamylalc','cinnamylalcohol'],

 ['styrax','styraxresinoid'],

 ['cypriol','cypriolnagarmotha','nagarmotha'],
 ['sweetorangeeo','orangeeo'],
 ['gammadecalactone','decalactone'],
];
const nrm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function sameMaterial(a,b){
 const x=nrm(a),y=nrm(b);
 if(x===y)return true;
 // alias groups match on the complete name only
 const g=ALIAS.find(gr=>gr.includes(x));
 if(g&&g.includes(y))return true;
 // otherwise allow a containment match, but only when the shorter name is
 // a whole leading or trailing word of the longer one
 const[short,long]=x.length<=y.length?[x,y]:[y,x];
 if(short.length>=4&&(long.startsWith(short)||long.endsWith(short))){
  // guard against 'isoe' vs 'isoeugenol' style false hits
  const aliasA=ALIAS.find(gr=>gr.includes(x)), aliasB=ALIAS.find(gr=>gr.includes(y));
  if(aliasA&&aliasB&&aliasA!==aliasB)return false;
  return true;
 }
 return false;
}

async function loadLibrary(){

 const builtIn=MAT.map(r=>r.slice());
 const rows=[],ids={};
 d.mat.forEach(m=>{
  const name=(m.name||'').trim();
  if(!name||skip.test(name))return;
  if(rows.some(r=>sameMaterial(r[0],name)))return;
  const[f,b]=place(name);
  rows.push([name,f,b,m.ifra,m.conc,m.price,m.bottleSize,m.priceVerified?1:0]);
  ids[name]=m.id;
 });
 if(!rows.length)return null;
 let carried=0;
 builtIn.forEach(r=>{
  if(rows.some(x=>sameMaterial(x[0],r[0])))return;
  rows.push(r);carried++;
 });
 MAT.length=0; rows.forEach(r=>MAT.push(r));
 studioIds=ids;
 return {studio:rows.length-carried, carried};
}

function readingData(bt,names,sh){
 const fams={};let sweet=0,dry=0,ten=0,dif=0,res=0;
 names.forEach(n=>{fams[P[n].fam]=(fams[P[n].fam]||0)+sh[n];
  if(/maltol|vanill|benzoin|coumarin|tonka|milk|C18|Orange/i.test(n))sweet+=sh[n];
  if(/vetiver|oakmoss|iso e|petitgrain|guaiac|styrax|patchouli/i.test(n))dry+=sh[n];
  if(TEN.test(n))ten+=sh[n];if(DIF.test(n))dif+=sh[n];
  if(/benzoin|styrax|oakmoss/i.test(n))res+=sh[n]});
 const band=k=>names.filter(n=>P[n].band===k).sort((a,b)=>sh[b]-sh[a]).slice(0,3);
 const words={};names.forEach(n=>desc(n).forEach(w=>words[w]=(words[w]||0)+sh[n]));
 const has=r=>names.some(n=>r.test(n));

 let genre='';
 if(isoE>30)genre='minimalist skin-scent — Iso E at '+Math.round(isoE)+'% is an overdose, and that becomes the effect';
 else if(has(/oakmoss/i)&&has(/bergamot/i)&&fams.floral>8)genre='chypre';
 else if(has(/coumarin/i)&&has(/oakmoss|linalool/i)&&dry>12)genre='fougère';
 else if(has(/calone/i)&&fams.citrus>12)genre='aquatic';
 else if(sweet>25)genre='gourmand — sweetness is the subject';
 else if(sweet>12)genre='gourmand accent — sweetness as facet';
 else if(has(/geraniol|citronellol|rose oxide/i))genre='rose composition';
 else if(fams.wood>35&&sweet<10)genre='dry woody-amber';
 else if(fams.citrus>35)genre='cologne — citrus-led';
 let cl,ck;
 if(sweet>22&&dry<8){cl='poor — sweet with no dry contrast will bloom and cloy in heat';ck='bad'}
 else if(res>18&&dry<10){cl='marginal — resinous weight gets heavy in humidity';ck='warn'}
 else if(dry>15&&sweet<15){cl='good — dry and transparent, holds up in heat';ck='good'}
 else{cl='workable — sweetness is countered';ck='ok'}
 const s=[];
 if(fams.floral>8&&!sel['Hedione'])s.push('Hedione — florals sit flat without it');
 if(sweet>10&&dry<5)s.push('vetiver or Iso E Super for dryness');
 if(fams.citrus>20&&!fams.wood)s.push('a wood base — citrus has nowhere to land');
 if((sel['Geraniol']||sel['Citronellol'])&&!sel['β-damascone'])s.push('β-damascone — rose body without depth reads thin');
 if(sel['Ethyl Maltol']&&sh['Ethyl Maltol']>12)s.push('ethyl maltol is high — it flattens what sits around it');
 if(bt.base>0&&bt.base<20)s.push('more base — under 20% will not hold');
 return{band,words:Object.entries(words).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]),genre,cl,ck,sugg:s,
  lon:ten>45?'long — 6h+':ten>25?'moderate — 4–6h':ten>12?'short — 2–4h':'very short — under 2h',
  pro:dif>45?'strong, fills a room':dif>22?"moderate, arm's length":'close to skin',
  mac:res?'3+ weeks — resinoid present':has(/EO|Tonka/i)?'2 weeks — naturals present':'1 week — all synthetic',
  hasAmb:has(/ambroxan|cashmeran|habanolide/i)}}

function brief(bt,names,sh){
 const b=$('#brief');
 if(!names.length){b.textContent='Select materials to see what this should smell like.';return}
 const d=readingData(bt,names,sh);
 let t='<div class="bs2"><b>Wear arc</b><br>';
 t+='<span class="tm">0–30m</span> '+(bt.top?d.band('top').join(', '):'nothing — opens into the heart')+'<br>';
 t+='<span class="tm">30m–3h</span> '+(bt.heart?d.band('heart').join(', '):'gap')+'<br>';
 t+='<span class="tm">3h+</span> '+(bt.base?d.band('base').join(', '):'nothing')+'</div>';
 if(d.words.length)t+='<div class="bs2"><b>Character</b><br>'+d.words.join(' · ')+'</div>';
 if(d.genre)t+='<div class="bs2"><b>Reads as</b><br>'+d.genre+'</div>';
 t+='<div class="bs2"><b>Performance</b><br>longevity '+d.lon+' · projection '+d.pro+'</div>';
 t+='<div class="bs2 '+d.ck+'"><b>Karachi climate</b><br>'+d.cl+'</div>';
 t+='<div class="bs2"><b>Maceration</b><br>'+d.mac+'</div>';
 if(d.hasAmb)t+='<div class="bs2"><b>Note</b><br>ambiguous base material present — the "smell it again" quality</div>';
 if(d.sugg.length)t+='<div class="bs2"><b>Consider</b><br>'+d.sugg.join('<br>')+'</div>';
 b.innerHTML=t;
}

function buildPDF(){
 const names=Object.keys(sel);if(!names.length){alert('Nothing to export.');return}
 const{out:sh,su}=shares(),cg=cgram(),ord={top:0,heart:1,base:2};
 const bt={top:0,heart:0,base:0};names.forEach(n=>bt[P[n].band]+=sh[n]);
 const d=readingData(bt,names,sh);
 let rows='',cost=0;
 const line=n=>{const m=M(n),w=cg*sh[n]/100,wa=weighAs(w),c=w*perG(n);cost+=c;
  return`<tr><td>${n}${m[4]<100?' <i style="font-size:7.5px">('+m[4]+'% in carrier)</i>':''}</td>`+
   `<td class="r">${sh[n].toFixed(1)}%</td><td class="r">${m[4]<100?(sh[n]*m[4]/100).toFixed(2)+'%':'—'}</td>`+
   `<td class="r">${wa.t}</td><td class="r">${c>=1?Math.round(c):c.toFixed(1)}</td></tr>`};
 blocks.forEach(b=>{const mem=b.m.filter(n=>sel[n]!==undefined);if(!mem.length)return;
  rows+=`<tr class="bh"><td colspan="4">${b.n}</td><td class="r">${mem.reduce((a,n)=>a+sh[n],0).toFixed(1)}%</td></tr>`;
  mem.sort((a,c)=>ord[P[a].band]-ord[P[c].band]).forEach(n=>rows+=line(n))});
 const free=names.filter(n=>!blockOf(n)).sort((a,c)=>ord[P[a].band]-ord[P[c].band]);
 if(free.length&&blocks.some(b=>b.m.some(n=>sel[n]!==undefined)))rows+='<tr class="bh"><td colspan="5">Unblocked</td></tr>';
 free.forEach(n=>rows+=line(n));
 const eth=W()-cg;cost+=eth*ETH_G;
 rows+=`<tr><td>Ethanol</td><td class="r">—</td><td class="r">—</td><td class="r">${eth.toFixed(2)}g</td><td class="r">${Math.round(eth*ETH_G)}</td></tr>`;
 rows+=`<tr class="tt"><td>Total</td><td class="r">${su.toFixed(1)}%</td><td class="r"></td><td class="r">${W().toFixed(1)}g</td><td class="r">Rs ${Math.round(cost)}</td></tr>`;
 const viol=[];names.forEach(n=>{const m=M(n),act=sh[n]*conc()/100*(m[4]/100);
  if(m[3]!=null&&act>m[3])viol.push(n+' — '+act.toFixed(2)+'% vs '+m[3]+'% limit')});
 const dil=names.filter(n=>weighAs(cg*sh[n]/100).tier>0);
 const ty=TYPES.find(t=>t[1]===conc());
 $('#pv').innerHTML=`<h2>${($('#nm').value||'UNTITLED').toUpperCase()}</h2>
 <div class="meta">TRACE · ${ty?ty[0]:''} ${conc()}% · ${W()}g batch · concentrate ${cg.toFixed(2)}g + ethanol ${eth.toFixed(2)}g · ${new Date().toLocaleDateString()}</div>
 <table><tr><th>Material</th><th class="r">% conc</th><th class="r">active</th><th class="r">weigh</th><th class="r">Rs</th></tr>${rows}</table>
 <div class="cols"><div class="col">
  <div class="sec">Wear arc</div>
  <div class="ln">0–30m · ${bt.top?d.band('top').join(', '):'—'}</div>
  <div class="ln">30m–3h · ${bt.heart?d.band('heart').join(', '):'—'}</div>
  <div class="ln">3h+ · ${bt.base?d.band('base').join(', '):'—'}</div>
  <div class="sec">Structure</div><div class="ln">top ${Math.round(bt.top)}% · heart ${Math.round(bt.heart)}% · base ${Math.round(bt.base)}%</div>
  <div class="sec">Character</div><div class="ln">${d.words.join(' · ')}</div>
  ${d.genre?'<div class="sec">Reads as</div><div class="ln">'+d.genre+'</div>':''}
 </div><div class="col">
  <div class="sec">Performance</div><div class="ln">longevity ${d.lon}</div><div class="ln">projection ${d.pro}</div>
  <div class="sec">Maceration</div><div class="ln">${d.mac}</div>
  <div class="sec">Karachi climate</div><div class="ln">${d.cl}</div>
  <div class="sec">Cost</div><div class="ln">Rs ${Math.round(cost)} this batch · Rs ${Math.round(W()?cost/W()*50:0)} per 50g bottle${window._est?' (some estimated)':''}</div>
 </div></div>
 <div class="sec">IFRA</div>${viol.length?viol.map(v=>'<div class="fl">OVER — '+v+'</div>').join(''):'<div class="ln">All limits clear at this concentration.</div>'}
 ${dil.length?'<div class="sec">Weighing</div>'+dil.map(n=>{const t=weighAs(cg*sh[n]/100);
   return'<div class="fl">'+n+' — dilute what you hold '+(t.tier===1?'1:9':'1:99')+', weigh '+t.t.replace(/[†‡]/g,'').trim()+'</div>'}).join(''):''}
 ${d.sugg.length?'<div class="sec">Consider</div>'+d.sugg.map(s=>'<div class="ln">· '+s+'</div>').join(''):''}
 <div style="margin-top:8px;font-size:7px;color:#888;border-top:1px solid #ccc;padding-top:4px">
 IFRA figures are Category 4 (fine fragrance) as % of finished product, seeded from memory and unverified. Confirm against the official IFRA Standards before commercial use.</div>`;
 window.print();
}

(function init(){
 const s=$('#ty');TYPES.forEach(([n,c])=>{const o=document.createElement('option');o.value=c;o.textContent=n+' · '+c+'%';s.append(o)});
 s.value=15;s.onchange=refresh;$('#wt').oninput=refresh;$('#nm').oninput=refresh;
 const bs=$('#blkSel');
 bs.innerHTML='<option value="">— choose —</option>'+Object.keys(PRESETS).map(k=>`<option>${k}</option>`).join('')+'<option value="__new">+ Empty block…</option>';
 bs.onchange=()=>{const v=bs.value;if(!v)return;
  if(v==='__new'){const n=prompt('Block name');if(n)blocks.push({id:bid++,n,m:[]})}
  else{const b={id:bid++,n:v,m:[]};PRESETS[v].forEach(([mn,p])=>{if(M(mn)){sel[mn]=p;b.m.push(mn)}});blocks.push(b)}
  bs.value='';draw()};
 $('#norm').onclick=()=>{const ns=Object.keys(sel),su=ns.reduce((a,n)=>a+(sel[n]||0),0);
  if(!su)return;ns.forEach(n=>sel[n]=Math.round(sel[n]/su*1000)/10);draw()};
 $('#reset').onclick=()=>{if(Object.keys(sel).length&&!confirm('Clear everything?'))return;
  sel={};blocks=[];bid=1;$('#nm').value='';$('#wt').value=20;$('#ty').value=15;Store.set(SKEY,'');draw()};
 $('#pdf').onclick=buildPDF;
 $('#save').onclick=saveToStudio;
 if('serviceWorker' in navigator)navigator.serviceWorker.register('compose-sw.js').catch(()=>{});
 loadLibrary().then(r=>{
  const h=layout();
  $('#map').setAttribute('height',h+10);
  if(r){$('#src').textContent='library: '+r.studio+' from Studio'+(r.carried?' + '+r.carried+' built-in':'');
   $('#src').title=r.carried
    ? r.carried+' material(s) are on this map but not yet in your Studio library — add them in Studio so cost and stock track properly.'
    : 'All materials loaded from your Studio library.';}
  else{$('#src').textContent='library: built-in defaults';
   $('#src').title='No Studio data on this device. Open Studio and import your data to link them.';}
  $('#save').style.display=r?'':'none';
  return Store.get(SKEY);
 }).then(v=>{
  if(v){try{const d=JSON.parse(v);
   sel=d.sel||{};blocks=d.blocks||[];bid=d.bid||1;
   Object.keys(sel).forEach(n=>{if(!MAT.find(m=>m[0]===n))delete sel[n]});
   blocks.forEach(b=>b.m=b.m.filter(n=>sel[n]!==undefined));
   if(d.nm)$('#nm').value=d.nm; if(d.ty)$('#ty').value=d.ty; if(d.wt)$('#wt').value=d.wt;
  }catch(e){}}
  draw();
 });
})();

async function saveToStudio(){
 const names=Object.keys(sel);
 if(!names.length){alert('Nothing to save.');return}
 if(!studioIds){alert('No Studio library linked on this device.');return}
 const v=await Store.get(LKEY); if(!v){alert('Studio data not found.');return}
 const d=JSON.parse(v);
 const{out:sh}=shares();
 const missing=names.filter(n=>!studioIds[n]);
 if(missing.length){alert('Not in the Studio library: '+missing.join(', '));return}
 const res=/benzoin|styrax|oakmoss/i, nat=/EO|Tonka/i;
 d.form.push({id:Math.random().toString(36).slice(2,9),
  name:$('#nm').value||'From Compose',conc:conc(),
  mac:names.some(n=>res.test(n))?3:names.some(n=>nat.test(n))?2:1,
  note:'Built in Compose'+(blocks.length?' — blocks: '+blocks.filter(b=>b.m.some(n=>sel[n]!==undefined)).map(b=>b.n).join(', '):'')+'.',
  parked:'',
  items:names.map(n=>({ref:studioIds[n],acc:false,pct:Math.round(sh[n]*10)/10}))});
 await Store.set(LKEY,JSON.stringify(d));
 alert('Saved to Studio as "'+($('#nm').value||'From Compose')+'".');
}
</script>
